api_version: gbrain-schema-pack-v1
name: puddingclaw-wiki
version: 0.4.0
description: PuddingClaw LLM Wiki custom schema pack
gbrain_min_version: 0.42.0
extends: gbrain-base-v2
borrow_from: []
page_types:
  - name: system
    primitive: entity
    path_prefixes:
      - systems/
    aliases:
      - agent-system
      - ai-system
      - agent-product
    extractable: false
    expert_routing: false
  - name: debate
    primitive: concept
    path_prefixes:
      - debates/
    aliases:
      - comparison
      - controversy
      - tradeoff
    extractable: false
    expert_routing: false
  - name: research_paper
    primitive: media
    path_prefixes:
      - papers/
    aliases:
      - paper
      - arxiv-paper
      - technical-report
    extractable: false
    expert_routing: false
  - name: software_framework
    primitive: entity
    path_prefixes:
      - frameworks/
    aliases:
      - agent-framework
      - ai-framework
      - sdk
    extractable: false
    expert_routing: false
  - name: ai_model
    primitive: entity
    path_prefixes:
      - models/
    aliases:
      - model
      - llm
      - foundation-model
    extractable: false
    expert_routing: false
  - name: programming_language
    primitive: entity
    path_prefixes:
      - languages/
    aliases:
      - language
      - programming-language
    extractable: false
    expert_routing: false
  - name: engineering_practice
    primitive: concept
    path_prefixes:
      - practices/
    aliases:
      - practice
      - engineering-experience
      - lesson-learned
      - best-practice
    extractable: false
    expert_routing: false
link_types:
  - name: supports
    inverse: supported_by
  - name: challenges
    inverse: challenged_by
  - name: introduces
    inverse: introduced_by
  - name: implements
    inverse: implemented_by
  - name: uses
    inverse: used_by
  - name: depends_on
    inverse: dependency_of
  - name: evaluates
    inverse: evaluated_by
  - name: applies_to
    inverse: applied_by
frontmatter_links: []
takes_kinds:
  - fact
  - take
  - bet
  - hunch
enrichable_types: []
filing_rules: []
